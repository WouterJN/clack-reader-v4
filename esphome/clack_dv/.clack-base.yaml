# Basics
esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: -100
    then:
      - script.execute: on_boot

# Enable Home Assistant API
api:
  reboot_timeout: 0s
  actions:
    - action: water_meter_value
      variables:
        meter_value: float
      then:
        - pulse_meter.set_total_pulses:
            id: clack_flow_rate
            value: !lambda |-
              id(water_meter_force_overwrite) = true;
              return float(meter_value) * id(pulse_per_liter);

    - action: water_m3_left
      variables:
        m3_left: float
      then:
        - pulse_meter.set_total_pulses:
            id: clack_flow_rate
            value: !lambda |-
              id(water_meter_force_overwrite) = true;
              float liters_left = float(m3_left) * 1000;
              float meter_value = id(clack_capacity_liters).state - liters_left;
              return float(meter_value) * id(pulse_per_liter);

    - action: last_distance_value #set last measured salt distance to any value in cm.
      variables:
        new_distance_value: float
      then:
        - lambda: |-
            id(last_distance) = float(new_distance_value);
        - component.update: clack_distance

globals:
  - id: totalWaterUsage
    type: float
    restore_value: yes
    initial_value: '0.0'

  # Clack DV flowmeter 28.60  / Clack WS1: 16.30 / (to be checked)
  - id: pulse_per_liter
    type: float
    restore_value: yes
    initial_value: '28.60'

  # Define a global variable for the chlorinator delay duration in minutes
  - id: duration
    type: int
    restore_value: yes
    initial_value: '15'

  # Define a global variable for the leakage delay duration in minutes
  - id: duration_leakage
    type: int
    restore_value: yes
    initial_value: '30'

  # Define a global variable for the water flow timeout in seconds
  - id: duration_water_flow_timeout
    type: float
    restore_value: yes
    initial_value: '6.5'

  # Define a global variable for last regeneration time
  - id: cycle_step
    type: std::string
    restore_value: yes
    initial_value: '"Idle"'

  # Define a global variable for last regeneration time
  - id: regen_last
    type: int
    restore_value: yes
    initial_value: '0'

  # Define a global variable for resinclean time
  - id: resinclean_last
    type: int
    restore_value: yes
    initial_value: '0'

  # Define a global variable for saltfill_last time
  - id: saltfill_last
    type: int
    restore_value: yes
    initial_value: '0'

  # Define a global variable for fill_last datetime
  # Deprecated in favour of the new "saltfill_last" global variable
  - id: fill_last
    type: std::string
    restore_value: yes
    initial_value: '"Never"'

  # Define a global variable to store last value of the distance
  - id: last_distance
    type: float
    restore_value: yes
    initial_value: '0.0'

  # Define a global variable that blocks a new reg cycle
  - id: wait_on_delay
    type: bool
    restore_value: yes
    initial_value: 'false'

  # Define a global variable that blocks a new reg cycle
  - id: water_meter_freeze
    type: bool
    restore_value: yes
    initial_value: 'false'

  # Define a global variable to force overwrite the totalWaterUsage value
  - id: water_meter_force_overwrite
    type: bool
    restore_value: no
    initial_value: 'false'

  # Define a global variable that shows motor run
  - id: motor_run
    type: bool
    restore_value: yes
    initial_value: 'false'

  # cycle timer
  - id: start_time
    type: int
    restore_value: yes
    initial_value: '0'

  # cycle timer total
  - id: start_time_total
    type: int
    restore_value: yes
    initial_value: '0'

  ### record last settings during regen.
  # Deprecated in favour of the new save_total_operation_time global variable
  - id: save_total_time_used
    type: std::string
    restore_value: yes
    initial_value: '"Unknown"'

  - id: save_total_operation_time
    type: int
    restore_value: yes
    initial_value: '0'

  - id: save_total_liters_used
    type: float
    restore_value: yes
    initial_value: '0.0'

  - id: total_run_time_regen
    type: int
    restore_value: yes
    initial_value: '0'

  - id: save_brine_time
    type: int
    restore_value: yes
    initial_value: '0'

  - id: save_backwash_time
    type: int
    restore_value: yes
    initial_value: '0'

  - id: save_backwash2_time
    type: int
    restore_value: yes
    initial_value: '0'

  - id: save_rinse_time
    type: int
    restore_value: yes
    initial_value: '0'

  - id: save_fill_time
    type: int
    restore_value: yes
    initial_value: '0'

  - id: save_service_time
    type: int
    restore_value: yes
    initial_value: '0'

  - id: save_total_run_time
    type: int
    restore_value: yes
    initial_value: '0'

  - id: leakage_detected
    type: bool
    restore_value: no
    initial_value: 'false'

  # Predicted next regeneration (UTC timestamp, 0 = unknown) and whether it is caused by water usage
  - id: next_regen_ts
    type: int
    restore_value: no
    initial_value: '0'

  - id: next_regen_water
    type: bool
    restore_value: no
    initial_value: 'false'

  # Average water use per day and the water that can still be used before the valve regenerates early
  - id: avg_daily_use
    type: float
    restore_value: no
    initial_value: 'NAN'

  - id: early_regen_margin
    type: float
    restore_value: no
    initial_value: 'NAN'

  # Time the last regeneration ended; salt readings are ignored until it has settled
  - id: regen_end_time
    type: int
    restore_value: yes
    initial_value: '0'

  # Brine tank is drawn down (after brine, before fill): salt is visible during a regeneration
  - id: salt_window_open
    type: bool
    restore_value: no
    initial_value: 'false'

  # Deepest salt reading since the last regeneration has settled (reference for refill detection)
  - id: idle_distance
    type: float
    restore_value: yes
    initial_value: '0.0'

  # Salt refill detection: start time and deepest reading of a sustained closer reading
  - id: refill_candidate_start
    type: int
    restore_value: no
    initial_value: '0'

  - id: refill_candidate_distance
    type: float
    restore_value: no
    initial_value: '0.0'

script:
  ### On reboot or powerloss of the esp, set the time left, last regeneration time, and capacity counters
  # Script "on_boot"
  - id: on_boot
    then:
      # A reboot stops a running regeneration script, but the restored flags would keep
      # blocking regeneration detection and salt readings forever. Start again from Idle.
      - lambda: |-
          if (id(wait_on_delay)) {
            ESP_LOGW("main", "Reboot during regeneration (step %s), resetting to Idle", id(cycle_step).c_str());
            id(wait_on_delay) = false;
            id(water_meter_freeze) = false;
            id(cycle_step) = "Idle";
            id(start_time) = 0;
            id(start_time_total) = 0;
          }
      - component.update: clack_saltfill_last # add old date to dashboard when boot
      - component.update: clack_resinclean_last # add old date to dashboard when boot
      - component.update: clack_regeneration_last # add old date to dashboard when boot
      - component.update: clack_capacity_days # add old date to dashboard when boot
      - component.update: clack_time_to_resinclean # add old time to dashboard when boot
      - component.update: clack_time_to_regen # add old time to dashboard when boot
      - component.update: clack_next_regen_hours
      - component.update: clack_distance # add old distance to dashboard when boot
      - pulse_meter.set_total_pulses: # Publish the initial state of totalWaterUsage on boot
          id: clack_flow_rate
          value: !lambda |-
            return id(totalWaterUsage) * id(pulse_per_liter);
      - sensor.template.publish: # Set initial value of water flow rate to 0 to avoid Unknown value
          id: clack_flow_rate
          state: 0
      - component.update: clack_save_total_liters_used
      - component.update: clack_save_total_operation_time
      - component.update: clack_backwash_time
      - component.update: clack_brine_time
      - component.update: clack_backwash2_time
      - component.update: clack_rinse_time
      - component.update: clack_fill_time
      - component.update: clack_service_time
#      - lambda: |-
#          id(cycle_step) = "Idle";
      - component.update: clack_cycle_step
      - component.update: clack_cycle_runtime
      - component.update: clack_cycle_total_runtime
      - component.update: clack_total_run_time
      - component.update: clack_watermeter_total
      #- lambda: 'id(wait_on_delay) = false;'
      #- lambda: 'id(water_meter_freeze) = false;'

  ### Define a script that waits for a specified amount of time and then sets the leakage alarm bool
  # Script "check_leakage"
  - id: check_leakage
    mode: restart
    then:
      - if:
          condition:
            binary_sensor.is_on: clack_water_flowing
          then:
            # Use a lambda expression to return the delay in milliseconds
            - delay: !lambda "return id(duration_leakage) * 60 * 1000;"
            - lambda: 'id(leakage_detected) = true;'
            - wait_until:
                condition:
                  binary_sensor.is_off: clack_water_flowing
                timeout: 20s
            - lambda: 'id(leakage_detected) = false;'

  ### Process a salt distance reading from the TOF sensor.
  # Water covers the salt after a regeneration fill, which reads closer than the salt itself.
  # Therefore only keep the deepest reading (salt only goes down). During a regeneration only
  # readings between brine and fill are used (tank drawn down), after it the settle time is skipped.
  # A salt refill is detected as a sustained closer reading outside a regeneration and its settle
  # time (the water level only changes during a regeneration).
  # Script "process_salt_reading"
  - id: process_salt_reading
    mode: queued
    parameters:
      distance: float
    then:
      - lambda: |-
          if (distance <= 0.0) return;  // invalid reading

          auto now = id(sntp_time).now();
          bool in_regen = id(wait_on_delay);
          if (in_regen && !id(salt_window_open)) return;
          if (!in_regen && now.is_valid()) {
            int settle = int(id(clack_salt_settle_time).state * 3600);
            if (now.timestamp < id(regen_end_time) + settle) return;
          }

          // Salt only goes down: keep the deepest reading
          if (id(last_distance) <= 0.0 || distance >= id(last_distance)) {
            id(last_distance) = distance;
          }
          if (in_regen) return;

          // Refill detection, only against readings of the same idle period. After a post fill
          // regeneration the water covers the salt, which reads closer than the salt seen during
          // the regeneration, but the water level stays the same until the next regeneration.
          if (id(idle_distance) <= 0.0 || distance >= id(idle_distance)) {
            id(idle_distance) = distance;
            id(refill_candidate_start) = 0;
            return;
          }

          float threshold = id(clack_salt_refill_detect).state;
          if (!now.is_valid() || threshold <= 0.0 || distance > id(idle_distance) - threshold) {
            id(refill_candidate_start) = 0;  // noise, or refill detection disabled
            return;
          }

          if (id(refill_candidate_start) == 0) {
            id(refill_candidate_start) = now.timestamp;
            id(refill_candidate_distance) = distance;
          } else {
            id(refill_candidate_distance) = std::max(id(refill_candidate_distance), distance);
          }

          if (now.timestamp - id(refill_candidate_start) >= 3600) {
            ESP_LOGI("main", "Salt refill detected: %.1f cm -> %.1f cm", id(last_distance), id(refill_candidate_distance));
            id(last_distance) = id(refill_candidate_distance);
            id(idle_distance) = id(refill_candidate_distance);
            id(saltfill_last) = now.timestamp;
            id(refill_candidate_start) = 0;
            id(clack_saltfill_last).update();
          }
      - component.update: clack_distance

  ### Define a script that sets a motor run to simulate steps.
  # Script "clack_motor_run"
  - id: clack_motor_run
    then:
      - lambda: 'id(motor_run) = true;'
      - delay: 100ms
      - lambda: 'id(motor_run) = false;'

  ### Define a script that turns on the chlorinator relay, waits for the duration, and turns it off
  # Script "chlorinator_start"
  - id: chlorinator_start
    mode: restart
    then:
      - if:
          condition:
            - lambda: 'return id(clack_select_chl_or_dpsw).current_option() == "Chlorinator";'
          then:
            - switch.turn_on: chlorinator_relay
            # Use a lambda expression to return the delay in milliseconds
            - delay: !lambda "return id(duration) * 60 * 1000;"
            - switch.turn_off: chlorinator_relay

  # Script "chlorinator_stop"
  - id: chlorinator_stop
    mode: restart
    then:
      - if:
          condition:
            - lambda: 'return id(clack_select_chl_or_dpsw).current_option() == "Chlorinator";'
          then:
            - switch.turn_off: chlorinator_relay

  ### Define a script that resets the watermeter during regeneration
  # Script "reset_water_meter"
  - id: reset_water_meter
    mode: restart
    then:
      - pulse_meter.set_total_pulses:
          id: clack_flow_rate
          value: !lambda |-
            id(water_meter_force_overwrite) = true;
            return 0;

  ### Define a script that visualize the cycle steps in regeneration
  # Script "decide_cycle"
  - id: decide_cycle
    mode: single
    then:
      - script.execute: clack_motor_run  #give pulse when motor runs to different step.
      # Upflow - Post fill    : BRINE/BACKWASH/RINSE/FILL
      # Upflow - Pre fill     : FILL/SERVICE/BRINE/BACKWASH/RINSE
      # Downflow - Post fill  : BACKWASH/BRINE/BACKWASH2/RINSE/FILL
      # Downflow - Pre fill   : FILL/SERVICE/BACKWASH/BRINE/BACKWASH2/RINSE
      - if:
          condition:
            lambda: 'return id(wait_on_delay) == false;'
          then:
            - lambda: |-
                std::string clack_cycle = id(clack_select_cycle).current_option();
                
                if (clack_cycle == "${clack_upflow_post_fill}") {
                  id(cycle_steps_post_upflow).execute();
                } else if (clack_cycle == "${clack_upflow_pre_fill}") {
                  id(cycle_steps_pre_upflow).execute();
                } else if (clack_cycle == "${clack_downflow_post_fill}") {
                  id(cycle_steps_post_downflow).execute();
                } else if (clack_cycle == "${clack_downflow_pre_fill}") {
                  id(cycle_steps_pre_downflow).execute();
                }

  ### Define a script that visualize the cycle steps in regeneration cycle "post" and "Upflow brining"
  # Script "cycle_steps_post_upflow"
  - id: cycle_steps_post_upflow
    mode: single
    then:
      # Initial "post" flow steps
      - script.execute: initial_post_cycle_steps
      # Step 1: Brine
      - script.execute: start_brine_cycle
      - script.execute: chlorinator_start
      - script.wait: chlorinator_start
      - script.execute: continue_brine_cycle
      - script.wait: continue_brine_cycle
      # Step 2: Backwash
      - script.execute: start_backwash_cycle
      - script.execute: chlorinator_stop
      - script.execute: continue_backwash_cycle
      - script.wait: continue_backwash_cycle
      # Step 3: Rinse
      - script.execute: start_rinse_cycle
      - script.execute: continue_rinse_cycle
      - script.wait: continue_rinse_cycle
      # Step 4: Fill
      - script.execute: start_fill_cycle
      - script.execute: continue_fill_cycle
      - script.wait: continue_fill_cycle
      # Final flow steps
      - script.execute: update_total_run_time
      - script.execute: reset_cycle_steps
      - script.wait: reset_cycle_steps

  ### Define a script that visualize the cycle steps in regeneration cycle "pre" and "Upflow brining"
  # Script "cycle_steps_pre_upflow"
  - id: cycle_steps_pre_upflow
    mode: single
    then:
      # Initial "pre" flow steps
      - script.execute: initial_pre_cycle_steps
      # Step 1: Fill - keep running water meter
      - script.execute: start_fill_cycle
      - script.execute: continue_fill_cycle
      - script.wait: continue_fill_cycle
      # Step 2: Service - keep running water meter
      - script.execute: start_service_cycle
      - script.execute: continue_service_cycle
      - script.wait: continue_service_cycle
      # Intermediate "pre" flow steps
      - script.execute: intermediate_pre_cycle_steps
      # Step 3: Brine
      - script.execute: start_brine_cycle
      - script.execute: chlorinator_start
      - script.wait: chlorinator_start
      - script.execute: continue_brine_cycle
      - script.wait: continue_brine_cycle
      # Step 4: Backwash
      - script.execute: start_backwash_cycle
      - script.execute: chlorinator_stop
      - script.execute: continue_backwash_cycle
      - script.wait: continue_backwash_cycle
      # Step 5: Rinse
      - script.execute: start_rinse_cycle
      - script.execute: continue_rinse_cycle
      - script.wait: continue_rinse_cycle
      # Final flow steps
      - script.execute: update_total_run_time
      - script.execute: reset_cycle_steps
      - script.wait: reset_cycle_steps

  ### Define a script that visualize the cycle steps in regeneration cycle "post" and "Downflow brining"
  # Script "cycle_steps_post_downflow"
  - id: cycle_steps_post_downflow
    mode: single
    then:
      # Initial "post" flow steps
      - script.execute: initial_post_cycle_steps
      # Step 1: Backwash
      - script.execute: start_backwash_cycle
      - script.execute: continue_backwash_cycle
      - script.wait: continue_backwash_cycle
      # Step 2: Brine
      - script.execute: start_brine_cycle
      - script.execute: chlorinator_start
      - script.wait: chlorinator_start
      - script.execute: continue_brine_cycle
      - script.wait: continue_brine_cycle
      # Step 3: Backwash2
      - script.execute: start_backwash2_cycle
      - script.execute: chlorinator_stop
      - script.execute: continue_backwash2_cycle
      - script.wait: continue_backwash2_cycle
      # Step 4: Rinse
      - script.execute: start_rinse_cycle
      - script.execute: continue_rinse_cycle
      - script.wait: continue_rinse_cycle
      # Step 5: Fill
      - script.execute: start_fill_cycle
      - script.execute: continue_fill_cycle
      - script.wait: continue_fill_cycle
      # Final flow steps
      - script.execute: update_total_run_time
      - script.execute: reset_cycle_steps
      - script.wait: reset_cycle_steps

  ### Define a script that visualize the cycle steps in regeneration cycle "pre" and "Downflow brining"
  # Script "cycle_steps_pre_downflow"
  - id: cycle_steps_pre_downflow
    mode: single
    then:
      # Initial "pre" flow steps
      - script.execute: initial_pre_cycle_steps
      # Step 1: Fill - keep running water meter
      - script.execute: start_fill_cycle
      - script.execute: continue_fill_cycle
      - script.wait: continue_fill_cycle
      # Step 2: Service - keep running water meter
      - script.execute: start_service_cycle
      - script.execute: continue_service_cycle
      - script.wait: continue_service_cycle
      # Intermediate "pre" flow steps
      - script.execute: intermediate_pre_cycle_steps
      # Step 3: Backwash
      - script.execute: start_backwash_cycle
      - script.execute: continue_backwash_cycle
      - script.wait: continue_backwash_cycle
      # Step 4: Brine
      - script.execute: start_brine_cycle
      - script.execute: chlorinator_start
      - script.wait: chlorinator_start
      - script.execute: continue_brine_cycle
      - script.wait: continue_brine_cycle
      # Step 5: Backwash2
      - script.execute: start_backwash2_cycle
      - script.execute: chlorinator_stop
      - script.execute: continue_backwash2_cycle
      - script.wait: continue_backwash2_cycle
      # Step 6: Rinse
      - script.execute: start_rinse_cycle
      - script.execute: continue_rinse_cycle
      - script.wait: continue_rinse_cycle
      # Final flow steps
      - script.execute: update_total_run_time
      - script.execute: reset_cycle_steps
      - script.wait: reset_cycle_steps

  ## Cycle step scripts
  # Script "update_total_liters_used"
  - id: update_total_liters_used
    mode: single
    then:
      - lambda: |-
          id(save_total_liters_used) = id(totalWaterUsage);
      - component.update: clack_save_total_liters_used

  # Script "update_total_operation_time"
  - id: update_total_operation_time
    mode: single
    then:
      - lambda: |-
          id(save_total_operation_time) = id(sntp_time).now().timestamp - id(regen_last);
      - component.update: clack_save_total_operation_time

  # Script "update_regen_last"
  - id: update_regen_last
    mode: single
    then:
      - lambda: |-
          id(regen_last) = id(sntp_time).now().timestamp;
      - component.update: clack_regeneration_last
      - component.update: clack_next_regen_hours

  # Script "update_regeneration_start_time"
  - id: update_regeneration_start_time
    mode: single
    then:
      - lambda: |-
          id(start_time_total) = id(sntp_time).now().timestamp;
      - component.update: clack_cycle_total_runtime

  # Script "start_brine_cycle"
  - id: start_brine_cycle
    mode: single
    then:
      - lambda: |-
          id(cycle_step) = "Brine";
          id(start_time) = id(sntp_time).now().timestamp;
      - component.update: clack_cycle_step

  # Script "continue_brine_cycle"
  - id: continue_brine_cycle
    mode: single
    then:
      - delay: 20s
      - wait_until:
          condition:
            binary_sensor.is_on: bin_sens_motor_run
          timeout: 4800s
      ## store Brine time
      - lambda: |-
          id(save_brine_time) = id(clack_cycle_runtime).state;
          id(salt_window_open) = true;
      - component.update: clack_brine_time

  # Script "start_backwash_cycle"
  - id: start_backwash_cycle
    mode: single
    then:
      - lambda: |-
          id(cycle_step) = "Backwash";
          id(start_time) = id(sntp_time).now().timestamp;
      - component.update: clack_cycle_step

  # Script "continue_backwash_cycle"
  - id: continue_backwash_cycle
    mode: single
    then:
      - delay: 20s
      - wait_until:
          condition:
            binary_sensor.is_on: bin_sens_motor_run
          timeout: 1000s
      ## store Backwash time
      - lambda: |-
          id(save_backwash_time) = id(clack_cycle_runtime).state;
      - component.update: clack_backwash_time

  # Script "start_backwash2_cycle"
  - id: start_backwash2_cycle
    mode: single
    then:
      - lambda: |-
          id(cycle_step) = "Backwash2";
          id(start_time) = id(sntp_time).now().timestamp;
      - component.update: clack_cycle_step

  # Script "continue_backwash2_cycle"
  - id: continue_backwash2_cycle
    mode: single
    then:
      - delay: 20s
      - wait_until:
          condition:
            binary_sensor.is_on: bin_sens_motor_run
          timeout: 1000s
      ## store Backwash2 time
      - lambda: |-
          id(save_backwash2_time) = id(clack_cycle_runtime).state;
      - component.update: clack_backwash2_time

  # Script "start_rinse_cycle"
  - id: start_rinse_cycle
    mode: single
    then:
      - lambda: |-
          id(cycle_step) = "Rinse";
          id(start_time) = id(sntp_time).now().timestamp;
      - component.update: clack_cycle_step

  # Script "continue_rinse_cycle"
  - id: continue_rinse_cycle
    mode: single
    then:
      - delay: 20s
      - wait_until:
          condition:
            binary_sensor.is_on: bin_sens_motor_run
          timeout: 1000s
      ## store Rinse time
      - lambda: |-
          id(save_rinse_time) = id(clack_cycle_runtime).state;
      - component.update: clack_rinse_time

  # Script "start_fill_cycle"
  - id: start_fill_cycle
    mode: single
    then:
      - lambda: |-
          id(cycle_step) = "Fill";
          id(start_time) = id(sntp_time).now().timestamp;
          id(salt_window_open) = false;
      - component.update: clack_cycle_step

  # Script "continue_fill_cycle"
  - id: continue_fill_cycle
    mode: single
    then:
      - delay: 20s
      - wait_until:
          condition:
            binary_sensor.is_on: bin_sens_motor_run
          timeout: 400s
      ## store Fill time
      - lambda: |-
          id(save_fill_time) = id(clack_cycle_runtime).state;
      - component.update: clack_fill_time

  # Script "start_service_cycle"
  - id: start_service_cycle
    mode: single
    then:
      - lambda: |-
          id(cycle_step) = "Service";
          id(start_time) = id(sntp_time).now().timestamp;
      - component.update: clack_cycle_step

  # Script "continue_service_cycle"
  - id: continue_service_cycle
    mode: single
    then:
      - delay: 20s
      - wait_until:
          condition:
            binary_sensor.is_on: bin_sens_motor_run
          timeout: 14500s
      ## store Service time
      - lambda: |-
          id(save_service_time) = id(clack_cycle_runtime).state;
      - component.update: clack_service_time

  # Script "initial_post_cycle_steps"
  - id: initial_post_cycle_steps
    mode: single
    then:
      - lambda: |-
          id(wait_on_delay) = true;
          id(salt_window_open) = false;
      - lambda: id(water_meter_freeze) = true;
      ## store used liters
      - script.execute: update_total_liters_used
      ## store used time
      - script.execute: update_total_operation_time
      ## store last regeneration time
      - script.execute: update_regen_last
      ## reset watermeter to 0 ltr
      - script.execute: reset_water_meter
      ## start regeneration
      - script.execute: update_regeneration_start_time

  # Script "initial_pre_cycle_steps"
  - id: initial_pre_cycle_steps
    mode: single
    then:
      - lambda: |-
          id(wait_on_delay) = true;
          id(salt_window_open) = false;
      ################
      ## start regeneration
      - script.execute: update_regeneration_start_time

  # Script "intermediate_pre_cycle_steps"
  - id: intermediate_pre_cycle_steps
    mode: single
    then:
      ## store used liters
      - script.execute: update_total_liters_used
      ## store used time
      - script.execute: update_total_operation_time
      ## store last regeneration time
      - script.execute: update_regen_last
      ## reset watermeter to 0 ltr
      - script.execute: reset_water_meter
      ## freeze watermeter
      - lambda: id(water_meter_freeze) = true;

  # Script "update_total_run_time"
  - id: update_total_run_time
    mode: single
    then:
      ## store Total run time
      - lambda: |-
          id(save_total_run_time) = id(sntp_time).now().timestamp - id(start_time_total);
      - component.update: clack_total_run_time

  # Script "reset_cycle_steps"
  - id: reset_cycle_steps
    mode: single
    then:
      # Idle
      - lambda: |-
          id(cycle_step) = "Idle";
          id(start_time) = 0;
          id(start_time_total) = 0;
          id(salt_window_open) = false;
          id(regen_end_time) = id(sntp_time).now().timestamp;
          id(idle_distance) = 0.0;
          id(refill_candidate_start) = 0;
      - component.update: clack_cycle_step
      - component.update: clack_cycle_runtime
      - component.update: clack_cycle_total_runtime
      - lambda: |-
          id(water_meter_freeze) = false;
      # The motor keeps moving for several seconds when returning to service.
      # Keep blocking a new cycle meanwhile, otherwise those pulses start a phantom regeneration.
      - delay: 60s
      - lambda: |-
          id(wait_on_delay) = false;

interval:
  # Process the salt distance at a fixed rate, also when it does not change (refill detection)
  - interval: 60s
    then:
      - if:
          condition:
            lambda: 'return id(clack_distance_tof).has_state();'
          then:
            - script.execute:
                id: process_salt_reading
                distance: !lambda 'return id(clack_distance_tof).state;'

  - interval: 1s
    then:
      - if:
          condition:
            lambda: |-
              return id(start_time) > 0;
          then:
            - component.update: clack_cycle_runtime
      - if:
          condition:
            lambda: |-
              return id(start_time_total) > 0;
          then:
            - component.update: clack_cycle_total_runtime

binary_sensor:
  - platform: status
    name: ${clack_status}

  - platform: template
    name: ${clack_motor_running}
    id: bin_sens_motor_run
    internal: false
    lambda: |-
      if (id(motor_run)) {
        return true;
      } else {
        return false;
      }
    filters:
      - delayed_off: 500ms

  - platform: template
    name: ${clack_water_flowing}
    id: clack_water_flowing
    lambda: |-
      return (id(clack_flow_rate).state > 0);
    on_state:
      - if:
          condition:
            binary_sensor.is_on: clack_water_flowing
          then:
            - script.execute: check_leakage

  - platform: template
    name: ${clack_water_leakage}
    icon: mdi:home-flood
    id: clack_water_leakage
    lambda: |-
      return id(leakage_detected);

button:
  ### ESP restart button
  # Button "restart_button"
  - platform: restart
    id: restart_button
    name: ${clack_restart}
    icon: mdi:button-pointer

  ### ESP restart (safe mode) button
  # Button "safe_mode_button"
  - platform: safe_mode
    id: safe_mode_button
    name: ${clack_safe_mode}
    icon: mdi:button-pointer

  # Button "test_motor_run"
  - platform: template
    name: ${clack_test_motor_run}
    id: test_motor_run
    on_press:
      then:
        - script.execute: clack_motor_run  #give pulse when motor runs to different step.
        - if:
            condition:
              lambda: 'return id(wait_on_delay) == false;'
            then:
              - script.execute: decide_cycle #choose what regeneration cycle to run

#-----------
#SENSORS
#-----------
sensor:
  ##
  # Power meter - ch1- clack pcb / ch2- Atom s3 lite esp / ch3- chlorinator
  - platform: ina3221
    address: 0x41  #A0-VCC
    channel_1:
      shunt_resistance: 0.1 ohm
      power:
        id: ch1_power
        internal: true
        filters:
          - lambda: |-
              if (isnan(x)) {
                return 0;
              } else {
                return x;
              }
          - or:
            - delta: 0.5
            - median:
                window_size: 7
                send_every: 4
                send_first_at: 3
          - round: 1
        on_value:
          - component.update: clack_power  #template sensor
        on_value_range:
          - above: 1.0
            then:
              - script.execute: decide_cycle  #choose what regeneration cycle to run
      bus_voltage:
        id: ch1_voltage #Voltage ch1 - 2 - 3 are the same
        internal: true
        filters:
          - lambda: |-
              if (isnan(x)) {
                return 0;
              } else {
                return x;
              }
          - median:
              window_size: 7
              send_every: 4
              send_first_at: 3
          - delta: 0.1
          - round: 1
        on_value:
          then:
            - component.update: clack_voltage  #template sensor

    channel_2:
      shunt_resistance: 0.1 ohm
      power:
        id: ch2_power
        internal: true
        filters:
          - lambda: |-
              if (isnan(x)) {
                return 0;
              } else {
                return x;
              }
          - median:
              window_size: 7
              send_every: 4
              send_first_at: 3
          - delta: 0.1
          - round: 1
        on_value:
          - component.update: clack_power_esp  #template sensor

    channel_3:
      shunt_resistance: 0.1 ohm
      power:
        id: ch3_power
        internal: true
        filters:
          - lambda: |-
              if (isnan(x)) {
                return 0;
              } else {
                return x;
              }
          - median:
              window_size: 7
              send_every: 4
              send_first_at: 3
          - delta: 0.2
          - round: 1
        on_value:
          - component.update: clack_power_chlorinator  #template sensor          
    update_interval: 1s

  ##
  # Time Of Flight distance sensor.
  # Sensor "clack_distance"
  - platform: template
    name: ${clack_distance}
    id: clack_distance
    unit_of_measurement: cm
    accuracy_decimals: 1
    icon: "mdi:arrow-expand-vertical"
    device_class: distance
    state_class: measurement
    update_interval: never
    lambda:
      return id(last_distance);
    on_value:
      then:
        - component.update: clack_height

  # Sensor "clack_watermeter_total"
  - platform: template
    id: clack_watermeter_total
    name: ${clack_watermeter_total}
    unit_of_measurement: L
    device_class: water
    state_class: total_increasing
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(totalWaterUsage);
    on_value:
      then:
        - component.update: clack_l_left

  # Sensor "clack_voltage"
  - platform: template
    id: clack_voltage
    name: ${clack_voltage}
    icon: mdi:lightning-bolt
    unit_of_measurement: V
    accuracy_decimals: 1
    device_class: voltage
    state_class: measurement
    update_interval: never
    lambda: |-
      return id(ch1_voltage).state;

  # Sensor "clack_power"
  - platform: template
    id: clack_power
    name: ${clack_power}
    icon: mdi:flash
    unit_of_measurement: W
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    update_interval: never
    lambda: |-
      return id(ch1_power).state;

  # Sensor "clack_power_esp"
  - platform: template
    id: clack_power_esp
    name: ${clack_power_esp}
    icon: mdi:flash
    unit_of_measurement: W
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    update_interval: never
    lambda: |-
      return id(ch2_power).state;

  # Sensor "clack_power_chlorinator"
  - platform: template
    id: clack_power_chlorinator
    name: ${clack_power_chlorinator}
    icon: mdi:flash
    unit_of_measurement: W
    accuracy_decimals: 1
    device_class: power
    state_class: measurement
    update_interval: never
    lambda: |-
      return id(ch3_power).state;

  ##
  # TOF distance sensor calculate tank_percentage
  # Sensor "clack_procent"
  #
  # Explanation of the calculation
  # max_distance = 30,0
  # min_distance = 0,0
  # salt_level_distance = 30,0
  # salt_level_height = 6,7
  # percentage = (6,7 / 30,0) * 100 = 22,333
  #
  - platform: template
    id: clack_procent
    name: ${clack_procent}
    unit_of_measurement: "%"
    accuracy_decimals: 0
    icon: "mdi:percent-box-outline"
    update_interval: never
    state_class: measurement
    lambda: |-
      const float max_distance = id(clack_saltlevel_height_max).state; // height in cm to lowest level
      const float min_distance = id(clack_saltlevel_height_min).state; // height in cm to highest level
      float salt_level_distance = max_distance - min_distance;
      float salt_level_height = id(clack_height).state;
      float percentage = (salt_level_height / salt_level_distance) * 100;
      return int(percentage);
    filters:
    - lambda: |-
        if (x >= 100) return 100;
        else if (x <= 0) return 0;
        else return x;

  ##
  # Saltlevel animation picture on dashboard
  # Sensor "clack_salt_level"
  - platform: copy
    source_id: clack_procent
    id: clack_salt_level
    name: ${clack_animation}
    filters:
    - lambda: |-
        if (x >= 80) return 100;
        else if (x >= 65 && x <= 79) return 80;
        else if (x >= 40 && x <= 64) return 60;
        else if (x >= 20 && x <= 39) return 40;
        else if (x >= 10 && x <= 19) return 20;
        else if (x >= 5 && x <= 9) return 10;
        else if (x <= 4) return 0;
        else return x;

  ##
  # TOF distance sensor calculate salt level from bottom
  # Sensor "clack_height"
  - platform: template
    id: clack_height
    name: ${clack_height}
    unit_of_measurement: cm
    accuracy_decimals: 1
    icon: "mdi:hydraulic-oil-level"
    update_interval: ${clack_height_update_interval}
    device_class: distance
    state_class: measurement
    lambda: |-
      return id(clack_saltlevel_height_max).state - id(clack_distance).state;
    filters:
    - lambda: |-
        if (x >= 100) return 100;
        else if (x <= 0) return 0;
        else return x;
    on_value:
      - component.update: clack_procent
      - component.update: clack_fill_salt

  #------
  # CLACK
  #------
  # Watermeter
  # Sensor "clack_m3_left"
  - platform: template
    id: clack_m3_left
    name: ${clack_m3_left}
    unit_of_measurement: m³
    state_class: measurement
    accuracy_decimals: 2
    update_interval: never
    lambda: |-
      return id(clack_l_left).state * 0.001;
    filters:
    - lambda: |-
        if (x <= 0) return 0;
        return x;

  # Sensor "clack_l_left"
  - platform: template
    id: clack_l_left
    name: ${clack_l_left}
    unit_of_measurement: L
    state_class: measurement
    accuracy_decimals: 1
    update_interval: ${watermeter_update_interval}
    lambda: |-
      return id(clack_capacity_liters).state - id(totalWaterUsage);
    filters:
    - lambda: |-
        if (x <= 0) return 0;
        return x;
    on_value:
      then:
        - component.update: clack_m3_left
        - component.update: clack_percent_l_left

  # Sensor "clack_percent_l_left"
  - platform: template
    id: clack_percent_l_left
    name: ${clack_percent_l_left}
    icon: mdi:water-percent
    unit_of_measurement: "%"
    state_class: measurement
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      if (id(clack_capacity_liters).state <= 0) {
        return 0;
      }
      return float((id(clack_l_left).state / id(clack_capacity_liters).state) * 100);
    filters:
    - lambda: |-
        if (x >= 100) return 100;
        else if (x <= 0) return 0;
        else return x;

  ##
  # Sensor "clack_percent_time_left"
  #
  # Explanation of the calculation
  # regen_last_time = 1754006400
  # current_time = 1754416905
  # total_hours = ( 1754416905 - 1754006400) / 3600 = 114,029
  # capacity_hours = 14 * 24 = 336
  # remaining_hours = 336 - 114,029 = 221,971;
  # percentage = (221,971 / 336) * 100 = 66,063
  #
  - platform: template
    id: clack_percent_time_left
    name: ${clack_percent_time_left}
    icon: mdi:progress-clock
    unit_of_measurement: "%"
    device_class: ""
    state_class: measurement
    accuracy_decimals: 1
    update_interval: 600s
    lambda: |-
      float regen_last_time = id(regen_last);

      if (regen_last_time <= 0) {
        return 0;
      }
      
      float current_time = id(sntp_time).now().timestamp;
      float total_hours = (current_time - regen_last_time) / 3600;
      float capacity_hours = int(id(clack_capacity_days).state) * 24;
      float remaining_hours = capacity_hours - total_hours;
      float percentage = (remaining_hours / capacity_hours) * 100;
      return percentage;
    filters:
    - lambda: |-
        if (x >= 100) return 100;
        else if (x <= 0) return 0;
        else return x;

  ##
  # Sensor "clack_save_total_operation_time"
  - platform: template
    name: clack_save_total_operation_time
    id: clack_save_total_operation_time
    icon: mdi:water-check-outline
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      return id(save_total_operation_time);
    on_value:
      then:
        - component.update: clack_save_total_operation_time_txt

  ##
  # Sensor "clack_save_total_liters_used"
  - platform: template
    name: ${clack_save_total_liters_used}
    id: clack_save_total_liters_used
    icon: mdi:water-check-outline
    unit_of_measurement: L
    device_class: water
    state_class: total
    accuracy_decimals: 1
    update_interval: never
    lambda: |-
      return id(save_total_liters_used);

  ##
  # Sensor "clack_cycle_runtime"
  - platform: template
    name: clack_cycle_runtime
    id: clack_cycle_runtime
    icon: mdi:clock-start
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      if (id(start_time) > 0) {
        return id(sntp_time).now().timestamp - id(start_time);
      }
      return 0;
    on_value:
      then:
        - component.update: timer1

  ##
  # Sensor "clack_cycle_total_runtime"
  - platform: template
    name: clack_cycle_total_runtime
    id: clack_cycle_total_runtime
    icon: mdi:clock-start
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      if (id(start_time_total) > 0) {
        return id(sntp_time).now().timestamp - id(start_time_total);
      }
      return 0;
    on_value:
      then:
        - component.update: timer2

  ##
  # Sensor "clack_brine_time"
  - platform: template
    name: clack_brine_time
    id: clack_brine_time
    icon: mdi:clock-check-outline
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      return id(save_brine_time);
    on_value:
      then:
        - component.update: clack_brine_time_txt

  ##
  # Sensor "clack_backwash_time"
  - platform: template
    name: clack_backwash_time
    id: clack_backwash_time
    icon: mdi:clock-check-outline
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      return id(save_backwash_time);
    on_value:
      then:
        - component.update: clack_backwash_time_txt

  ##
  # Sensor "clack_backwash2_time"
  - platform: template
    name: clack_backwash2_time
    id: clack_backwash2_time
    icon: mdi:clock-check-outline
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      return id(save_backwash2_time);
    on_value:
      then:
        - component.update: clack_backwash2_time_txt

  ##
  # Sensor "clack_rinse_time"
  - platform: template
    name: clack_rinse_time
    id: clack_rinse_time
    icon: mdi:clock-check-outline
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      return id(save_rinse_time);
    on_value:
      then:
        - component.update: clack_rinse_time_txt

  ##
  # Sensor "clack_fill_time"
  - platform: template
    name: clack_fill_time
    id: clack_fill_time
    icon: mdi:clock-check-outline
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      return id(save_fill_time);
    on_value:
      then:
        - component.update: clack_fill_time_txt

  ##
  # Sensor "clack_service_time"
  - platform: template
    name: clack_service_time
    id: clack_service_time
    icon: mdi:clock-check-outline
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      return id(save_service_time);
    on_value:
      then:
        - component.update: clack_service_time_txt

  ##
  # Sensor "clack_total_run_time"
  - platform: template
    name: clack_total_run_time
    id: clack_total_run_time
    icon: mdi:clock-check-outline
    accuracy_decimals: 0
    update_interval: never
    internal: true
    lambda: |-
      return id(save_total_run_time);
    on_value:
      then:
        - component.update: clack_total_run_time_txt

  ##
  # Predict the next regeneration the way the valve decides it:
  # - The valve regenerates at its regeneration time. Its clock stays on winter time (UTC+1),
  #   so in summer time this is one hour later on the local clock.
  # - It counts one day each time its regeneration time passes and regenerates at the
  #   day override count (10 days after a night regeneration, 9 after a manual daytime one).
  # - Earlier when, at a regeneration time, the remaining capacity is less than its reserve
  #   (about one day of average use). That depends on the use of the last day, so it cannot
  #   be predicted days ahead; the margin below tells how much water is left before it happens.
  # Sensor "clack_next_regen_hours"
  - platform: template
    name: ${clack_next_regen_hours}
    id: clack_next_regen_hours
    icon: mdi:timer-sync-outline
    unit_of_measurement: h
    accuracy_decimals: 1
    state_class: measurement
    update_interval: 600s
    lambda: |-
      auto now = id(sntp_time).now();
      if (!now.is_valid() || id(regen_last) <= 0) {
        id(next_regen_ts) = 0;
        id(avg_daily_use) = NAN;
        id(early_regen_margin) = NAN;
        return NAN;
      }
      const int64_t day = 86400;
      int64_t regen_tod = llround(id(clack_valve_regen_time).state * 3600) - 3600;  // valve clock is UTC+1
      regen_tod = ((regen_tod % day) + day) % day;

      // First regeneration time of the valve after the last regeneration counts as day 1
      int64_t after = (int64_t) id(regen_last) + 3600;
      int64_t first = after - (((after % day) + day) % day) + regen_tod;
      if (first <= after) first += day;
      int override_days = std::max(1, (int) id(clack_valve_day_override).state);
      int64_t next = first + (int64_t) (override_days - 1) * day;
      bool water = false;

      // Average use per day: this cycle after one day, otherwise the previous cycle
      float used = id(totalWaterUsage);
      float days = (now.timestamp - id(regen_last)) / 86400.0f;
      float avg = NAN;
      if (days >= 1.0f) {
        avg = used / days;
      } else if (id(save_total_operation_time) >= day) {
        avg = id(save_total_liters_used) / (id(save_total_operation_time) / 86400.0f);
      }
      float margin = NAN;
      if (!isnan(avg)) {
        margin = id(clack_capacity_liters).state - avg - used;
        if (margin <= 0) {
          // Reserve reached: the valve regenerates at its next regeneration time
          int64_t t = first;
          while (t <= now.timestamp) t += day;
          if (t < next) {
            next = t;
            water = true;
          }
        }
      }
      id(next_regen_ts) = next;
      id(next_regen_water) = water;
      id(avg_daily_use) = avg;
      id(early_regen_margin) = margin;
      return std::max(0.0f, (next - now.timestamp) / 3600.0f);
    on_value:
      then:
        - component.update: clack_next_regen
        - component.update: clack_next_regen_reason
        - component.update: clack_avg_daily_use
        - component.update: clack_early_regen_margin

  # Sensor "clack_avg_daily_use": average water use per day (this cycle, or the previous one on day 1)
  - platform: template
    name: ${clack_avg_daily_use}
    id: clack_avg_daily_use
    icon: mdi:water-sync
    unit_of_measurement: L/d
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
    lambda: |-
      return id(avg_daily_use);

  # Sensor "clack_early_regen_margin": water that can still be used before the valve regenerates
  # earlier than the day override (capacity minus reserve of one day of average use)
  - platform: template
    name: ${clack_early_regen_margin}
    id: clack_early_regen_margin
    icon: mdi:water-alert-outline
    unit_of_measurement: L
    accuracy_decimals: 0
    state_class: measurement
    update_interval: never
    lambda: |-
      if (isnan(id(early_regen_margin))) return NAN;
      return std::max(0.0f, id(early_regen_margin));

  # Sensor "internal_temperature"
  - platform: internal_temperature
    name: "Internal Temperature"
    device_class: temperature
    state_class: measurement

select:
  # Select "clack_select_chl_or_dpsw"
  - id: clack_select_chl_or_dpsw
    name: ${clack_select_chl_or_dpsw}
    platform: template
    options:
      - ${clack_off}
      - ${clack_chlorinator}
    initial_option: ${clack_off}
    optimistic: true
    restore_value: true
    entity_category: config
    update_interval: never

  # Select "clack_select_cycle"
  - id: clack_select_cycle
    name: ${clack_regeneration_mode}
    platform: template
    optimistic: true
    restore_value: true
    options:
      - ${clack_upflow_post_fill}
      - ${clack_upflow_pre_fill}
      - ${clack_downflow_post_fill}
      - ${clack_downflow_pre_fill}
    initial_option: ${clack_downflow_post_fill}
    entity_category: config
    update_interval: never

##
# Text sensors with general information.
text_sensor:
  ##
  # Textsensor "clack_next_regen": predicted next regeneration (see clack_next_regen_hours)
  - platform: template
    name: ${clack_next_regen}
    id: clack_next_regen
    icon: mdi:calendar-sync
    device_class: timestamp
    update_interval: never
    lambda: |-
      if (id(next_regen_ts) <= 0) return {};
      time_t t = id(next_regen_ts);
      struct tm tm;
      gmtime_r(&t, &tm);
      char str[32];
      strftime(str, sizeof(str), "%Y-%m-%dT%H:%M:%S+00:00", &tm);
      return std::string(str);

  ##
  # Textsensor "clack_next_regen_reason": days (day override) or water usage (reserve)
  - platform: template
    name: ${clack_next_regen_reason}
    id: clack_next_regen_reason
    icon: mdi:help-circle-outline
    update_interval: never
    lambda: |-
      if (id(next_regen_ts) <= 0) return {};
      return std::string(id(next_regen_water) ? "${clack_reason_water}" : "${clack_reason_days}");

  ##
  # Expose ESPHome version as sensor.
  # Textsensor "clack_version"
  - platform: version
    id: clack_version
    name: ${clack_version}
    hide_timestamp: true

  ##
  # Expose WiFi information as sensors.
  # Textsensor "wifi_info"
  - platform: wifi_info
    ip_address:
      name: ${clack_ip}
      icon: mdi:ip-network

  ##
  # Textsensor "clack_fill_salt" yes or no.
  - platform: template
    name: ${clack_fill_salt}
    id: clack_fill_salt
    icon: mdi:basket-fill
    update_interval: never
    lambda: |-
      if (id(clack_height).state < id(clack_saltlevel_height_fill).state) {
        return std::string("${clack_yes}");
      } else {
        return std::string("${clack_no}");
      }

  ##
  # Textsensor "clack_cycle_step"
  - platform: template
    name: ${clack_cycle_step}
    id: clack_cycle_step
    icon: mdi:basket-fill
    update_interval: never
    lambda: |-
      return id(cycle_step);

  ##
  # Textsensor "clack_time_to_regen"
  #
  # Explanation of the calculation
  # regen_last_time = 1754006400
  # current_time = 1754416905
  # total_hours = ( 1754416905 - 1754006400) / 3600 = 114,029
  # capacity_hours = 14 * 24 = 336
  # remaining_hours = 336 - 114,029 = 221,971;
  # days = 221,971 / 24 = 9,249 = 9
  # hours = 221,971 % 24 = 5,971 = 6
  #
  - platform: template
    name: ${clack_time_to_regen}
    id: clack_time_to_regen
    icon: mdi:clock-outline
    update_interval: 600s
    lambda: |-
      char str[32];
      int64_t regen_last_time = id(regen_last);

      if (regen_last_time <= 0) {
        return std::string("Unknown");
      }

      int64_t current_time = id(sntp_time).now().timestamp;
      int64_t total_hours = (current_time - regen_last_time) / 3600;
      int64_t capacity_hours = int(id(clack_capacity_days).state) * 24;
      int64_t remaining_hours = capacity_hours - total_hours;
      int days = remaining_hours / 24;
      int hours = remaining_hours % 24;
      ${format_datetime_dh}

  ##
  # Textsensor "clack_time_to_resinclean"
  #
  # Explanation of the calculation
  # resinclean_last_time = 1754006400
  # current_time = 1754416905
  # total_hours = ( 1754416905 - 1754006400) / 3600 = 114,029
  # capacity_hours = 120 * 24 = 2880
  # remaining_hours = 2880 - 114,029 = 2765,971;
  # days = 2765,971 / 24 = 115,249 = 9
  # hours = 2765,971 % 24 = 5,971 = 6
  #
  - platform: template
    name: ${clack_time_to_resinclean}
    id: clack_time_to_resinclean
    icon: mdi:bacteria-outline
    update_interval: 600s
    lambda: |-
      char str[32];
      int64_t resinclean_last_time = id(resinclean_last);

      if (resinclean_last_time <= 0) {
        return std::string("Unknown");
      }
      
      int64_t current_time = id(sntp_time).now().timestamp;
      int64_t total_hours = (current_time - resinclean_last_time) / 3600;
      int64_t capacity_hours = int(id(resinclean_capacity_days).state) * 24;
      int64_t remaining_hours = capacity_hours - total_hours;
      int days = remaining_hours / 24;
      int hours = remaining_hours % 24;
      ${format_datetime_dh}

  ##
  # Textsensor "timer1"
  - platform: template
    name: ${clack_cycle_runtime}
    id: timer1
    icon: mdi:clock-start
    update_interval: never
    lambda: |-
      int time = int(id(clack_cycle_runtime).state);
      ${format_datetime_hms}

  ##
  # Textsensor "timer2"
  - platform: template
    name: ${clack_cycle_total_runtime}
    id: timer2
    icon: mdi:clock-start
    update_interval: never
    lambda: |-
      int time = int(id(clack_cycle_total_runtime).state);
      ${format_datetime_hms}

  ##
  # Textsensor "clack_save_total_operation_time_txt"
  - platform: template
    name: ${clack_save_total_operation_time}
    id: clack_save_total_operation_time_txt
    icon: mdi:clock-check-outline
    update_interval: never
    lambda: |-
      char str[32];
      int64_t operation_time = int(id(clack_save_total_operation_time).state);
      
      if (operation_time <= 0) {
        ESP_LOGI("main", "Fallback to 'save_total_time_used' since the new 'save_total_operation_time' does not have the operation time set yet: %s", id(save_total_time_used).c_str());
        return std::string(id(save_total_time_used));
      }
      
      int64_t total_hours = operation_time / 3600;      
      int days = total_hours / 24;
      int hours = total_hours % 24;
      
      ${format_datetime_dh}

  #
  ### saved times previous cycle to formatted text.
  ##
  # Textsensor "clack_brine_time_txt"
  - platform: template
    name: ${clack_brine_time_txt}
    id: clack_brine_time_txt
    icon: mdi:clock-check-outline
    update_interval: never
    lambda: |-
      int time = int(id(clack_brine_time).state);
      ${format_datetime_hms}

  ##
  # Textsensor "clack_backwash_time_txt"
  - platform: template
    name: ${clack_backwash_time_txt}
    id: clack_backwash_time_txt
    icon: mdi:clock-check-outline
    update_interval: never
    lambda: |-
      int time = int(id(clack_backwash_time).state);
      ${format_datetime_hms}

  ##
  # Textsensor "clack_backwash2_time_txt"
  - platform: template
    name: ${clack_backwash2_time_txt}
    id: clack_backwash2_time_txt
    icon: mdi:clock-check-outline
    update_interval: never
    lambda: |-
      int time = int(id(clack_backwash2_time).state);
      ${format_datetime_hms}

  ##
  # Textsensor "clack_rinse_time_txt"
  - platform: template
    name: ${clack_rinse_time_txt}
    id: clack_rinse_time_txt
    icon: mdi:clock-check-outline
    update_interval: never
    lambda: |-
      int time = int(id(clack_rinse_time).state);
      ${format_datetime_hms}

  ##
  # Textsensor "clack_fill_time_txt"
  - platform: template
    name: ${clack_fill_time_txt}
    id: clack_fill_time_txt
    icon: mdi:clock-check-outline
    update_interval: never
    lambda: |-
      int time = int(id(clack_fill_time).state);
      ${format_datetime_hms}

  ##
  # Textsensor "clack_service_time_txt"
  - platform: template
    name: ${clack_service_time_txt}
    id: clack_service_time_txt
    icon: mdi:clock-check-outline
    update_interval: never
    lambda: |-
      int time = int(id(clack_service_time).state);
      ${format_datetime_hms}

  ##
  # Textsensor "clack_total_run_time_txt"
  - platform: template
    name: ${clack_total_run_time_txt}
    id: clack_total_run_time_txt
    icon: mdi:clock-check-outline
    update_interval: never
    lambda: |-
      int time = int(id(clack_total_run_time).state);
      ${format_datetime_hms}

##
# imput numbers as sliders for setting the dimensions of the tank and level alarm.
number:
  ##
  # Set pulse per liters flowmeter
  # Number "clack_set_pulse_per_liters"
  - platform: template
    id: clack_set_pulse_per_liters
    name: ${clack_set_pulse_per_liters}
    icon: mdi:pulse
    optimistic: true
    mode: box
    step: 0.05
    entity_category: config
    min_value: 0
    max_value: 50
    initial_value: 28.60
    restore_value: yes
    unit_of_measurement: ""
    on_value:
      then:
        - lambda: |-
            id(pulse_per_liter) = float(x);

  ##
  # Set minimum distance (from bottom sensor / above plastic cap)
  # Number "clack_saltlevel_height_min"
  - platform: template
    id: clack_saltlevel_height_min
    name: ${clack_saltlevel_height_min}
    icon: mdi:toggle-switch-variant
    optimistic: true
    mode: slider
    step: 0.5
    entity_category: config
    min_value: 0
    max_value: 10
    initial_value: 0
    restore_value: yes
    unit_of_measurement: cm
    on_value:
      then:
        - component.update: clack_height

  ##
  # Set maximum distance (from bottom sensor / underneath plastic cap) to water level (to measure in pipe?)
  # Number "clack_saltlevel_height_max"
  - platform: template
    id: clack_saltlevel_height_max
    name: ${clack_saltlevel_height_max}
    icon: mdi:toggle-switch-variant-off
    optimistic: true
    mode: slider
    step: 0.5
    entity_category: config
    min_value: 0
    max_value: 100
    initial_value: 30
    restore_value: yes
    unit_of_measurement: cm
    on_value:
      then:
        - component.update: clack_height

  ##
  # Set alarm level
  # Number "clack_saltlevel_height_fill"
  - platform: template
    id: clack_saltlevel_height_fill
    name: ${clack_saltlevel_height_fill}
    icon: mdi:hydraulic-oil-temperature
    optimistic: true
    mode: slider
    step: 0.1
    entity_category: config
    min_value: 0
    max_value: 10
    initial_value: 1.5
    restore_value: yes
    unit_of_measurement: cm
    update_interval: never
    on_value:
      then:
        - component.update: clack_height

  ##
  # Set capacity liters
  # Number "clack_capacity_liters"
  - platform: template
    id: clack_capacity_liters
    name: ${clack_capacity_liters}
    icon: mdi:water-opacity
    optimistic: true
    mode: box
    step: 50
    entity_category: config
    min_value: 0
    max_value: 12000
    initial_value: 3700
    restore_value: yes
    unit_of_measurement: L
    on_value:
      then:
        - component.update: clack_l_left

  ##
  # Set capacity days
  # Number "clack_capacity_days"
  - platform: template
    id: clack_capacity_days
    name: ${clack_capacity_days}
    icon: mdi:calendar-clock
    optimistic: true
    mode: box
    step: 1
    entity_category: config
    min_value: 0
    max_value: 21
    initial_value: 14
    restore_value: yes
    unit_of_measurement: ${days}
    on_value:
      then:
        - component.update: clack_time_to_regen
        - component.update: clack_percent_time_left
        - component.update: clack_next_regen_hours
  ##
  # Set resinclean capacity days
  # Number "resinclean_capacity_days"
  - platform: template
    id: resinclean_capacity_days
    name: ${clack_resinclean_capacity_days}
    icon: mdi:calendar-clock
    optimistic: true
    mode: box
    step: 1
    entity_category: config
    min_value: 0
    max_value: 365
    initial_value: 120
    restore_value: yes
    unit_of_measurement: ${days}
    on_value:
      then:
        - component.update: clack_time_to_resinclean
  ##
  # Set chlorinator relay off-delay
  # Number "clack_chlorinator_delay"
  - platform: template
    id: clack_chlorinator_delay
    name: ${clack_chlorinator_delay}
    icon: mdi:toggle-switch-variant
    optimistic: true
    mode: box
    step: 1
    entity_category: config
    min_value: 0
    max_value: 45
    initial_value: 10
    restore_value: yes
    unit_of_measurement: "min"
    on_value:
      then:
        - lambda: |-
            id(duration) = int(x);

  ##
  # Set minimum time delay for leakage alarm
  # Number "clack_leakage_alarm_delay"
  - platform: template
    id: clack_leakage_alarm_delay
    name: ${clack_leakage_alarm_delay}
    icon: mdi:home-flood
    optimistic: true
    mode: box
    step: 1
    entity_category: config
    min_value: 0
    max_value: 60
    initial_value: 30
    restore_value: yes
    unit_of_measurement: "min"
    on_value:
      then:
        - lambda: |-
            id(duration_leakage) = int(x);


  ##
  # Hours after a regeneration during which salt readings are ignored (water settling)
  # Number "clack_salt_settle_time"
  - platform: template
    id: clack_salt_settle_time
    name: ${clack_salt_settle_time}
    icon: mdi:timer-sand
    optimistic: true
    mode: box
    step: 0.5
    entity_category: config
    min_value: 0
    max_value: 48
    initial_value: 6
    restore_value: yes
    unit_of_measurement: h

  ##
  # Salt refill detection: closer reading in cm that counts as a refill when stable for 1 hour (0 = off)
  # Number "clack_salt_refill_detect"
  - platform: template
    id: clack_salt_refill_detect
    name: ${clack_salt_refill_detect}
    icon: mdi:basket-fill
    optimistic: true
    mode: box
    step: 0.5
    entity_category: config
    min_value: 0
    max_value: 30
    initial_value: 3
    restore_value: yes
    unit_of_measurement: cm

  ##
  # Regeneration time set on the valve, on the valve clock (winter time, it does not switch)
  # Number "clack_valve_regen_time"
  - platform: template
    id: clack_valve_regen_time
    name: ${clack_valve_regen_time}
    icon: mdi:clock-time-nine-outline
    optimistic: true
    mode: box
    step: 0.25
    entity_category: config
    min_value: 0
    max_value: 23.75
    initial_value: 21
    restore_value: yes
    unit_of_measurement: h
    on_value:
      then:
        - component.update: clack_next_regen_hours

  ##
  # Day override set on the valve: regenerate at the latest after this many days
  # Number "clack_valve_day_override"
  - platform: template
    id: clack_valve_day_override
    name: ${clack_valve_day_override}
    icon: mdi:calendar-refresh
    optimistic: true
    mode: box
    step: 1
    entity_category: config
    min_value: 1
    max_value: 99
    initial_value: 10
    restore_value: yes
    unit_of_measurement: d
    on_value:
      then:
        - component.update: clack_next_regen_hours

  ##
  # Set minimum time delay for considering water flow stopped
  - platform: template
    id: clack_water_flow_timeout_delay
    name: ${clack_water_flow_timeout_delay}
    icon: mdi:waves-arrow-right
    optimistic: true
    mode: box
    step: 0.1
    entity_category: config
    min_value: 0
    max_value: 300
    initial_value: 6.5
    restore_value: yes
    unit_of_measurement: "s"
    on_value:
      then:
        - lambda: |-
            id(duration_water_flow_timeout) = float(x);
        - lambda: |-
            uint32_t timeout = id(duration_water_flow_timeout) * 1000000UL;
            id(clack_flow_rate).set_timeout_us(timeout);

substitutions:
  format_datetime_readable: |-
    char str[32];
    strftime(str, sizeof(str), "%a %d %b %H:%M", localtime(&datetime));
    return std::string(str);

  format_datetime_hms: |-
    char str[32];
    int sec = time;
    int min = sec / 60;
    int hrs = sec / 3600;
    sec %= 60;
    min %= 60;
    
    if (hrs > 0) {
      snprintf(str, sizeof(str), "%ih %im %is", hrs, min, sec);
    } else if (min > 0) {
      snprintf(str, sizeof(str), "%im %is", min, sec);
    } else {
      snprintf(str, sizeof(str), "%is", sec);
    }
    return std::string(str);

  format_datetime_dh: |-
    // Negative when overdue: show the sign once, e.g. "-336d 6h"
    const char *sign = (days < 0 || hours < 0) ? "-" : "";
    days = abs(days);
    hours = abs(hours);
    if (days > 0) {
      snprintf(str, sizeof(str), "%s%id %ih", sign, days, hours);
    } else {
      snprintf(str, sizeof(str), "%s%ih", sign, hours);
    }
    return std::string(str);
